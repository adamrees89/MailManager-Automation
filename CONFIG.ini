[scanner]
# Parent directories to scan. Put each parent directory on its own line
# under the `parents` value. Empty lines are ignored. You may still use
# commas or semicolons on a line to separate multiple entries if desired.
#
# Example (Windows):
# parents =
#     C:\\Data\\MailExports
#     D:\\OtherProjects
#
# Example (Linux/macOS):
# parents =
#     /mnt/data/mail
#     /home/user/projects
parents =


; Path to sqlite DB for projects. Can be absolute or relative.
; Example: db = N:\Path\to\projects.sqlite
db = projects.sqlite

# Optional: set to 1 to enable verbose output
verbose = 0

[bids]
# Bids parent directories. Scanner will look for `pending` and `submitted` subfolders.
# Example:
# parents =
#     N:\\Bids
#     K:\\Bids
parents =


[mappings]
# Office map: key:value pairs separated by commas or newlines. Keys are office abbrevs.
# Example: office_map = BR:Bristol,CA:Cardiff
office_map = BR:Bristol,CA:Cardiff

# Single-letter office expansions: map single letter to two-letter code
# Example: single_letter_map = B:BR,C:CA
single_letter_map = B:BR,C:CA

# Bid suffixes to detect (comma or newline separated). Case-insensitive.
# Example: bid_suffixes = BID LOST,NO BID
bid_suffixes = BID LOST,NO BID

[parsing]
# Parents that use strict naming (00000XX immediately, no spaces). One per line or comma separated.
# Example:
# strict_parents =
#     K:\\Projects
strict_parents =
