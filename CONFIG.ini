[scanner]
# Parent directories to scan. Put each parent directory on its own line
# under the `parents` value. Empty lines are ignored. You may still use
# commas or semicolons on a line to separate multiple entries if desired.
#
# Example (Windows):
# parents =
#     C:\\Data\\MailExports
#     D:\\OtherProjects
#
# Example (Linux/macOS):
# parents =
#     /mnt/data/mail
#     /home/user/projects
parents =

# Optional: set to 1 to enable verbose output
verbose = 0
